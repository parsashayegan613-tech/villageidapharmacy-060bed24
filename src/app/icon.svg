<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Blue background -->
  <rect width="512" height="512" fill="#1a4fa0" rx="60"/>

  <!-- I.D.A. red outline -->
  <text
    x="256"
    y="340"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="240"
    fill="none"
    stroke="#cc1111"
    stroke-width="16"
    text-anchor="middle"
    letter-spacing="-6"
  >IDA</text>

  <!-- I.D.A. white fill -->
  <text
    x="256"
    y="340"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="240"
    fill="white"
    text-anchor="middle"
    letter-spacing="-6"
  >IDA</text>
</svg>
